<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 258' width='960' height='258' font-family='Segoe UI, Helvetica, Arial, sans-serif'><rect x='1' y='1' width='958' height='256' rx='16' fill='#FFFFFF' stroke='#D3DCE5'/><text x='32' y='44' font-size='22' font-weight='700' fill='#14213A' text-anchor='start'>What you get</text><rect x='24' y='64' width='219' height='176' rx='12' fill='#0F766E' fill-opacity='0.07' stroke='#0F766E' stroke-opacity='0.35'/><text x='40' y='112' font-size='38' font-weight='800' fill='#0F766E' text-anchor='start'>420</text><text x='40' y='138' font-size='14' font-weight='700' fill='#14213A' text-anchor='start'>tested questions</text><text x='40' y='164' font-size='12' font-weight='400' fill='#586980' text-anchor='start'>A step-by-step and an</text><text x='40' y='181' font-size='12' font-weight='400' fill='#586980' text-anchor='start'>efficient answer for each,</text><text x='40' y='198' font-size='12' font-weight='400' fill='#586980' text-anchor='start'>which you can watch run</text><rect x='255' y='64' width='219' height='176' rx='12' fill='#2563EB' fill-opacity='0.07' stroke='#2563EB' stroke-opacity='0.35'/><text x='271' y='112' font-size='38' font-weight='800' fill='#2563EB' text-anchor='start'>91</text><text x='271' y='138' font-size='14' font-weight='700' fill='#14213A' text-anchor='start'>lessons</text><text x='271' y='164' font-size='12' font-weight='400' fill='#586980' text-anchor='start'>Worked by hand with real</text><text x='271' y='181' font-size='12' font-weight='400' fill='#586980' text-anchor='start'>numbers, explaining why things</text><text x='271' y='198' font-size='12' font-weight='400' fill='#586980' text-anchor='start'>work</text><rect x='486' y='64' width='219' height='176' rx='12' fill='#7C3AED' fill-opacity='0.07' stroke='#7C3AED' stroke-opacity='0.35'/><text x='502' y='112' font-size='38' font-weight='800' fill='#7C3AED' text-anchor='start'>22</text><text x='502' y='138' font-size='14' font-weight='700' fill='#1